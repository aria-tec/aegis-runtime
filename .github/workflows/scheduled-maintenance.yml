name: Scheduled Maintenance & Vulnerability Scanner

on:
  schedule:
    # Run every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  # =========================================================================
  # STRICT GATE (Blocking): Official CVE Scanner, SAST, Race Detector & Fuzzing
  # =========================================================================
  strict_security_and_fuzz:
    name: Security Invariants & Continuous Fuzzing (Strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Run Official Go Vulnerability Scanner (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run Go Security Static Analyzer (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet -exclude=G204,G304 ./...

      - name: Run Race Detector & Full Test Suite
        run: |
          go test -v -race -coverprofile=coverage.out ./...

      - name: Run Go Native Fuzz Testing Suite (30s per target)
        run: |
          go test -v -fuzz=FuzzDomainEventJSON -fuzztime=30s ./tests/...
          go test -v -fuzz=FuzzExecuteAgentAPI -fuzztime=30s ./tests/...
          go test -v -fuzz=FuzzMCPHandler -fuzztime=30s ./tests/...

  # =========================================================================
  # ADVISORY GATE (Non-blocking): Multi-Version Go Forward Compatibility
  # =========================================================================
  advisory_matrix:
    name: Forward Compatibility Matrix (Advisory)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25', 'stable', 'tip']
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Go (${{ matrix.go-version }})
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
        continue-on-error: ${{ matrix.go-version == 'tip' }}

      - name: Build and Test Matrix
        run: |
          go build ./...
          go test -v ./...
        continue-on-error: ${{ matrix.go-version == 'tip' }}
